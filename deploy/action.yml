name: 'Deploy a systemd user service to a remote host'
description: 'Builds/syncs the repo to a dedicated unprivileged account on the target and (re)starts it as a systemd user service — no sudo. Can reach a LAN-only target through a Cloudflare Tunnel or WireGuard.'

inputs:
  service_name:
    description: 'Name of the systemd user service (and of the directory in the deploy user''s home)'
    required: true
  deploy_key:
    description: 'SSH private key for deploy_user@deploy_host'
    required: true
  deploy_host:
    description: 'Hostname or IP of the target — a public IP/hostname works directly; a Cloudflare Tunnel hostname needs cf_access_client_id/secret; a LAN-only address needs wireguard_config'
    required: true
  deploy_host_key:
    description: 'Pinned known_hosts line(s) for deploy_host (`cat /etc/ssh/ssh_host_ed25519_key.pub` run *on the device*). Strongly recommended. If empty, falls back to trust-on-first-use via ssh-keyscan.'
    required: false
    default: ''
  deploy_user:
    description: 'Unprivileged account that owns and runs the service (default: service_name). Needs `loginctl enable-linger` once — see README.'
    required: false
    default: ''
  env_file:
    description: 'Uploaded as ~/<service_name>/.env, mode 600'
    required: false
    default: ''
  wireguard_config:
    description: 'Full wg-quick client config (as text) to bring up a tunnel into the target LAN before deploying. Leave empty if the runner already has network access.'
    required: false
    default: ''
  cf_access_client_id:
    description: 'Cloudflare Access service token Client ID. When set (with cf_access_client_secret), SSH goes through `cloudflared access ssh` to deploy_host — a Cloudflare Tunnel hostname routed to the target''s sshd. Requires deploy_host_key.'
    required: false
    default: ''
  cf_access_client_secret:
    description: 'Cloudflare Access service token Client Secret'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Checkout the repo
      uses: actions/checkout@v4

    - name: Resolve deploy user
      shell: bash
      run: |
        set -euo pipefail
        user="${{ inputs.deploy_user }}"
        echo "DEPLOY_USER=${user:-${{ inputs.service_name }}}" >> "$GITHUB_ENV"

    - name: Connect to WireGuard
      if: ${{ inputs.wireguard_config != '' }}
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -y
        sudo apt-get install -y wireguard-tools
        umask 077
        echo "${{ inputs.wireguard_config }}" | sudo tee /etc/wireguard/ci-deploy.conf > /dev/null
        sudo chmod 600 /etc/wireguard/ci-deploy.conf
        sudo wg-quick up ci-deploy

    - name: Install cloudflared
      if: ${{ inputs.cf_access_client_id != '' }}
      shell: bash
      env:
        CF_SECRET: ${{ inputs.cf_access_client_secret }}
        HOST_KEY: ${{ inputs.deploy_host_key }}
      run: |
        set -euo pipefail
        if [ -z "$CF_SECRET" ]; then
          echo "::error::cf_access_client_id is set but cf_access_client_secret is empty"
          exit 1
        fi
        if [ -z "$HOST_KEY" ]; then
          # ssh-keyscan can't go through a ProxyCommand, so there's no TOFU fallback here.
          echo "::error::deploy_host_key is required with cf_access_client_id"
          exit 1
        fi
        case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64) arch=arm64 ;;
          *) echo "::error::unsupported runner arch $(uname -m)"; exit 1 ;;
        esac
        mkdir -p ~/.local/bin
        curl -fsSL -o ~/.local/bin/cloudflared \
          "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-$arch"
        chmod +x ~/.local/bin/cloudflared
        ~/.local/bin/cloudflared --version

    - name: Setup SSH key
      shell: bash
      env:
        CF_ID: ${{ inputs.cf_access_client_id }}
        CF_SECRET: ${{ inputs.cf_access_client_secret }}
      run: |
        set -euo pipefail
        umask 077
        mkdir -p ~/.ssh
        echo "${{ inputs.deploy_key }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        touch ~/.ssh/known_hosts

        # Dedicated config (ssh -F) so a self-hosted runner's ~/.ssh/config is left alone.
        {
          echo "Host ${{ inputs.deploy_host }}"
          echo "  IdentityFile ~/.ssh/deploy_key"
          echo "  UserKnownHostsFile ~/.ssh/known_hosts"
          if [ -n "$CF_ID" ]; then
            echo "  ProxyCommand $HOME/.local/bin/cloudflared access ssh --hostname %h --service-token-id $CF_ID --service-token-secret $CF_SECRET"
          fi
        } > ~/.ssh/deploy_config

        if [ -n "${{ inputs.deploy_host_key }}" ]; then
          echo "${{ inputs.deploy_host_key }}" >> ~/.ssh/known_hosts
        else
          echo "::warning::deploy_host_key not set — trusting the host key on first connect (TOFU). Set deploy_host_key to pin it and prevent MITM."
          ssh-keyscan -H "${{ inputs.deploy_host }}" >> ~/.ssh/known_hosts
        fi

    - name: Prepare files
      shell: bash
      run: |
        set -euo pipefail
        if [ -x ./.deploy/build.sh ]; then
          echo "Running build.sh"
          ./.deploy/build.sh
        else
          echo "No build.sh found, copying all repo files to dist"
          mkdir -p dist
          rsync -av --files-from=<(git ls-files) --exclude='.deploy' ./ dist/
        fi

    - name: Prepare service unit (repo's .deploy/service.service or fallback template)
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dist_config
        if [ -f .deploy/service.service ]; then
          cp .deploy/service.service dist_config/service.service
        else
          cp ${{ github.action_path }}/templates/service.service dist_config/service.service
          sed -i "s/__SERVICE__/${{ inputs.service_name }}/g" dist_config/service.service
        fi

    - name: Sync runtime files to server
      shell: bash
      run: |
        set -euo pipefail
        rsync -avz --delete -e "ssh -F $HOME/.ssh/deploy_config" \
          ./dist/ "$DEPLOY_USER@${{ inputs.deploy_host }}:${{ inputs.service_name }}/"

    - name: Upload .env to server (if env_file is set)
      if: ${{ inputs.env_file != '' }}
      shell: bash
      run: |
        set -euo pipefail
        ssh -F $HOME/.ssh/deploy_config \
          "$DEPLOY_USER@${{ inputs.deploy_host }}" \
          "umask 177 && cat > ${{ inputs.service_name }}/.env" <<< "${{ inputs.env_file }}"

    - name: Sync service unit to server
      shell: bash
      run: |
        set -euo pipefail
        rsync -avz --delete -e "ssh -F $HOME/.ssh/deploy_config" \
          ./dist_config/ "$DEPLOY_USER@${{ inputs.deploy_host }}:.deploy-config/"

    - name: Install and restart user service
      shell: bash
      run: |
        set -euo pipefail
        ssh -F $HOME/.ssh/deploy_config \
          "$DEPLOY_USER@${{ inputs.deploy_host }}" \
          bash -s -- "${{ inputs.service_name }}" <<'EOF'
          set -euo pipefail
          service_name="$1"
          if [ "$(loginctl show-user "$(id -un)" -p Linger --value)" != "yes" ]; then
            echo "::error::Linger is off for $(id -un): the service would stop at logout. Run once as root: loginctl enable-linger $(id -un)"
            exit 1
          fi
          # Sessions without pam_systemd may lack these; under linger the user manager's bus lives here.
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          export DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS:-unix:path=$XDG_RUNTIME_DIR/bus}"
          mkdir -p ~/.config/systemd/user
          install -m 644 ~/.deploy-config/service.service ~/.config/systemd/user/"$service_name".service
          systemctl --user daemon-reload
          systemctl --user enable "$service_name"
          systemctl --user restart "$service_name"
          sleep 3
          if ! systemctl --user is-active --quiet "$service_name"; then
            systemctl --user --no-pager status "$service_name" || true
            journalctl --user -u "$service_name" -n 30 --no-pager || true
            echo "::error::$service_name is not running after restart"
            exit 1
          fi
        EOF

    - name: Remove SSH key
      if: always()
      shell: bash
      run: rm -f ~/.ssh/deploy_key ~/.ssh/deploy_config

    - name: Disconnect WireGuard
      if: always() && inputs.wireguard_config != ''
      shell: bash
      run: |
        sudo wg-quick down ci-deploy || true
        sudo rm -f /etc/wireguard/ci-deploy.conf
